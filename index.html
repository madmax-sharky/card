<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Максим Никитин — контакты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1012;--panel:#17191c;--panel2:#1d2024;--line:#2a2e33;
    --ink:#e8e6e1;--soft:#a8a6a0;--faint:#6f6e6a;
    --accent:#b06849;--link:#6fb1ff;
    --serif:"Fraunces",Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;
    align-items:center;justify-content:center;min-height:100vh;padding:32px 20px}
  a{text-decoration:none;color:inherit}
  .card{width:100%;max-width:380px;text-align:center}

  .ava{width:104px;height:104px;border-radius:50%;margin:0 auto 18px;
    overflow:hidden;background:#1d2024}
  .ava img{width:100%;height:100%;object-fit:cover;display:block}
  h1{font-family:var(--serif);font-weight:600;font-size:28px;letter-spacing:-.01em}
  .role{font-family:var(--serif);color:var(--accent);font-size:17.5px;font-weight:500;
    margin-top:5px}
  .loc{color:var(--faint);font-size:13px;margin-top:6px;margin-bottom:28px}

  .btn{display:flex;align-items:center;gap:14px;border-radius:13px;padding:15px 18px;
    font-weight:600;font-size:16px;margin-bottom:11px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);
    transition:transform .12s,border-color .12s,background .12s}
  .btn:hover{border-color:var(--accent);background:var(--panel2)}
  .btn:active{transform:scale(.985);border-color:var(--accent)}
  .btn .ic{width:22px;height:22px;flex:0 0 22px;display:flex;align-items:center;justify-content:center}
  .btn .ic svg{width:22px;height:22px;display:block;stroke:var(--accent)}
  .btn .tx{text-align:left;line-height:1.2}
  .btn .tx small{display:block;font-weight:400;font-size:12px;color:var(--faint);margin-top:2px}

  .copy{display:flex;align-items:center;gap:14px;border:1px solid var(--line);
    background:var(--panel);border-radius:13px;padding:15px 18px;margin-bottom:11px;
    cursor:pointer;transition:transform .12s,border-color .12s,background .12s}
  .copy:hover{border-color:var(--accent);background:var(--panel2)}
  .copy:active{transform:scale(.985);border-color:var(--accent)}
  .copy .ic{width:22px;height:22px;flex:0 0 22px;display:flex;align-items:center;justify-content:center}
  .copy .ic svg{width:22px;height:22px;stroke:var(--accent)}
  .copy .tx{text-align:left;flex:1;line-height:1.25}
  .copy .tx small{display:block;font-size:11px;color:var(--faint);
    text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
  .copy .tx span{font-size:14.5px;color:var(--ink)}
  .copy .act{font-size:11.5px;color:var(--faint);white-space:nowrap;transition:color .12s}
  .copy:hover .act{color:var(--accent)}
  .copy.done .act{color:#5fb98e}

  footer{margin-top:24px;color:var(--faint);font-size:11.5px}
</style>
</head>
